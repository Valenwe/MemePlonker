[project]
name = "meme-plonker"
version = "0.1.0"
description = "A simple Windows 98-styled meme editor built with Tkinter."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pillow>=11.1.0",
    # Drop-in replacement for `pygame` (still imported as `pygame`); unlike
    # upstream pygame it ships wheels for recent CPython, incl. 3.14.
    "pygame-ce>=2.5.7",
    "screeninfo>=0.8.1",
]

[project.scripts]
plonker = "meme_plonker.main:main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meme_plonker"]

[tool.hatch.build.targets.wheel.force-include]
# Bundle the small icon/sound assets so `plonker` works when installed as a
# global tool. The large meme library stays external (see MEMEPLONKER_MEMES).
"src" = "meme_plonker/src"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear, UP: pyupgrade, C4: comprehensions
select = ["E", "W", "F", "I", "B", "UP", "C4"]
ignore = [
    "E501",  # line length handled by the formatter, not enforced as an error
]

[tool.ruff.format]
quote-style = "double"
